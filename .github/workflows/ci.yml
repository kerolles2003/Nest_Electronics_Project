# Nest Electronics — CI (workspace checks + MongoDB transaction gate + API contract
# gate + the two browser gates)
#
# Scope: the pnpm + Turborepo workspace, the MongoDB transaction hard gate, the
# frozen OpenAPI v1 contract gate, and the Playwright suites for both front
# ends.
# Deliberately NOT included:
#   - no deploy / CD : still out of scope
#   - no secrets     : no job requires a credential, and none is referenced.
#                      MONGODB_URI here is a credential-free, runner-local
#                      address, which is also what makes it safe to write in
#                      plain text (see the transaction-gate job).
#
# Each check is a real gate. Nothing is marked continue-on-error, so a failure
# here reflects the true state of the repository rather than a suppressed one.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. No job here writes anything back — they lint, type-check,
# build, and compare two JSON documents — so the token does not need the
# repository default, which is write-all unless someone changed it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turborepo emits hyperlinks and spinners that are noise in CI logs.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned "packageManager": "pnpm@9.0.0" from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the declared engines floor: "node": ">=20".
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # PHASE 2.5 HARD GATE — MongoDB multi-document transactions.
  #
  # Authority: docs/architecture/CONSISTENCY-MODEL.md §1 ("the first
  #            integration test written must prove a transaction rolls back
  #            with no partial writes, IN EVERY ENVIRONMENT");
  #            docs/architecture/ARCHITECTURE-FREEZE-RATIFICATION.md §11 gate 4.
  #
  # This job must FAIL LOUDLY if transactions are unavailable. There is
  # deliberately no continue-on-error, no `|| true`, no conditional skip and no
  # environment probe that turns a missing replica set into a pass. Verified by
  # execution: pointed at a standalone mongod the suite exits 1 with
  # "Transaction numbers are only allowed on a replica set member or mongos".
  # ---------------------------------------------------------------------------
  transaction-gate:
    name: Transaction gate
    runs-on: ubuntu-latest

    env:
      # Runner-local and credential-free — this is an address, not a secret,
      # and it names its own database so the gate can never share a namespace
      # with anything else. It is read through the same validated
      # configuration boundary as every other environment (env.schema.ts).
      MONGODB_URI: mongodb://127.0.0.1:27017/nest_electronics_ci

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API refuses to boot without a signing key, by design: JWT_SECRET has
      # no default, and the .env.example placeholder is refused too, because a
      # placeholder nothing rejects IS a default. That rule is right, and it is
      # why both of these jobs failed the first time this workflow ever ran.
      #
      # Generated per run rather than stored. It is a throwaway key for a
      # database that is destroyed with the runner, so there is nothing to leak
      # and nothing to rotate — which keeps this workflow's promise that no job
      # requires a credential. A literal here would be a 32-character secret
      # committed to the repository, and the secret scan would rightly fail it.
      - name: Generate an ephemeral JWT_SECRET
        run: |
          echo "JWT_SECRET=$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")" >> "$GITHUB_ENV"

      # The SAME compose file local development uses, so CI and a developer's
      # machine prove the same thing about the same topology. Its healthcheck
      # initiates the replica set idempotently; --wait blocks until a PRIMARY
      # is reported.
      - name: Start MongoDB replica set
        run: docker compose -f docker-compose.dev.yml up -d --wait

      # Readiness is asserted, not assumed. A compose filename is not evidence
      # of a topology, so the server is asked directly before the gate runs.
      - name: Prove the topology has a PRIMARY
        run: >
          docker exec nest-electronics-mongo mongosh --quiet --eval
          'const h = db.adminCommand({ hello: 1 });
           if (!h.setName || !h.isWritablePrimary) {
             print("FAIL: not a replica set PRIMARY: " + JSON.stringify(h));
             quit(1);
           }
           print("replica set " + h.setName + " PRIMARY at " + h.me + ", server " + db.version());'

      # F-15 — the suite cannot pass against an empty database.
      #
      # Measured, not assumed. Against a fresh Mongo the run is 333 failed /
      # 194 passed, every failure reading "seed category development-boards is
      # missing — run `pnpm --filter api seed`".
      - name: Seed the catalogue
        run: pnpm --filter api seed

      # Seeding alone is NOT sufficient, which the original F-15 write-up did
      # not capture. With data but no indexes the run is still 19 failed / 508
      # passed: the index-usage, idempotency, transaction-atomicity and
      # concurrency suites assert on index behaviour, `autoIndex` is off
      # (deliberately — index creation is a release step, not a side effect of
      # booting), and a fresh database therefore has no order_user_history,
      # order_admin_queue or idempotency_key_unique for them to observe.
      #
      # With both steps the run is 538/538 green.
      - name: Create the indexes
        run: pnpm --filter api indexes:sync

      - name: Transaction gate
        run: pnpm --filter api test

      # Cleanup only. `if: always()` releases the container after a failure; it
      # does not affect the job outcome, and no step above can be skipped by it.
      - name: Stop MongoDB
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # ---------------------------------------------------------------------------
  # The API CONTRACT gate (Phase 3).
  #
  # docs/api/openapi.v1.json is what the mobile developer builds against. Once
  # frozen, an endpoint that quietly changes shape becomes a broken app in a
  # store somewhere, found by users rather than by CI. This job regenerates the
  # document from the live decorators and refuses any difference:
  #
  #   breaking (removed / retyped / newly required) -> fail, do not regenerate
  #   additive                                      -> fail, commit the artifact
  #
  # A separate job from the transaction gate on purpose: when CI goes red, the
  # job name should already say which contract broke.
  #
  # It needs MongoDB because the document is generated from the REAL module
  # graph — an artifact produced from a half-booted application would describe
  # an API that does not exist.
  # ---------------------------------------------------------------------------
  contract-gate:
    name: API contract drift gate
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/nest_electronics_contract

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API refuses to boot without a signing key, by design: JWT_SECRET has
      # no default, and the .env.example placeholder is refused too, because a
      # placeholder nothing rejects IS a default. That rule is right, and it is
      # why both of these jobs failed the first time this workflow ever ran.
      #
      # Generated per run rather than stored. It is a throwaway key for a
      # database that is destroyed with the runner, so there is nothing to leak
      # and nothing to rotate — which keeps this workflow's promise that no job
      # requires a credential. A literal here would be a 32-character secret
      # committed to the repository, and the secret scan would rightly fail it.
      - name: Generate an ephemeral JWT_SECRET
        run: |
          echo "JWT_SECRET=$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")" >> "$GITHUB_ENV"

      # docs/api/index.html embeds a COPY of the artifact so the contract can be
      # read by opening a file, with no server (a page that fetches its sibling
      # JSON is blocked over file://). A second copy is a thing that can
      # disagree with the first, so it is gated exactly like the artifact is.
      #
      # Deliberately BEFORE the database: this check boots nothing and needs no
      # Mongo, so when the page is stale CI says so in seconds rather than after
      # a container start and a full Nest build.
      - name: Check the browsable API page against the artifact
        run: pnpm --filter api openapi:page:check

      - name: Start MongoDB replica set
        run: docker compose -f docker-compose.dev.yml up -d --wait

      # WHAT THIS GATE CANNOT DO — see docs/api/INTEGRATION.md, "What the gate
      # does NOT catch". It compares two JSON documents, so it sees names,
      # types, required flags and structure, and nothing else. An enum
      # narrowing, a tightened validator, a newly-enforced constraint, or a
      # change in what an existing value MEANS all pass it green while breaking
      # a working client. A green gate is not a compatibility guarantee; it is
      # the absence of one specific class of mistake. The review obligation that
      # covers the rest is in the same section.
      - name: Check the OpenAPI artifact against the live API
        run: pnpm --filter api openapi:check

      - name: Stop MongoDB
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # ---------------------------------------------------------------------------
  # THE BROWSER GATES.
  #
  # Until now this workflow had five jobs and none of them opened a browser.
  # 169 Playwright tests existed — 95 storefront, 74 admin — and every one of
  # them ran only where a developer chose to run it. That is the fifth time in
  # this repository that an artifact existed while the guarantee it implies did
  # not, and it is the worst instance of the five, because these specs were
  # written precisely BECAUSE the developer machine could not be trusted: the
  # sharp defect existed only on linux-x64, and a Windows host could not
  # reproduce it in either direction.
  #
  # A suite nothing runs is documentation. These jobs are real gates — no
  # continue-on-error, no `|| true`, no conditional skip.
  #
  # ## Why two jobs rather than one
  #
  # Same reasoning the contract gate gives for being separate from the
  # transaction gate: when CI goes red the JOB NAME should already say what
  # broke. "Browser gate" failing tells you to go reading; "Admin browser gate"
  # failing tells you where. They also run on separate runners, so the wall
  # clock is the slower of the two rather than their sum.
  #
  # ## What they do NOT need, and why the step list is this short
  #
  # No seed step, no `indexes:sync` step, no admin provisioning step. Each
  # Playwright config starts its own API through `webServer`, and that command
  # runs `test-db --suite <suite> --ensure-clean` first, which synchronises the
  # declared indexes, seeds the catalogue, seeds the 27 shipping rates and
  # provisions the development admin — into a scratch database named per suite
  # (`nest_electronics_scratch_storefront`, `..._admin`), never the one in
  # MONGODB_URI. Adding those steps here would duplicate the preparation in a
  # second place that could drift from the first.
  #
  # What they DO need is the replica set, because the suites open transactions,
  # and a signing key, because the API refuses to boot without one.
  #
  # ## What is NOT protected by these jobs
  #
  # This workflow is `on: push: branches: [main]` + `pull_request`. A push to a
  # feature branch runs the secret scan (which is `branches: ['**']`) and
  # NOTHING ELSE — no lint, no types, no tests, and now no browser gate either.
  # That predates these jobs and is unchanged by them, but it is worth saying
  # plainly rather than leaving implied: between feature-branch pushes the
  # browser suites are unenforced, and the enforcement point is the pull
  # request. Work that never opens one is never gated.
  # ---------------------------------------------------------------------------
  storefront-browser-gate:
    name: Storefront browser gate
    runs-on: ubuntu-latest
    # A hung `next dev` should cost minutes, not the six-hour default.
    timeout-minutes: 30

    env:
      # Credential-free and runner-local, exactly like the gates above. The
      # suite overrides MONGODB_DB_NAME to its own scratch database, so the name
      # here is only what an unconfigured connection would land in.
      MONGODB_URI: mongodb://127.0.0.1:27017/nest_electronics_browser_storefront

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only: `playwright.config.ts` declares exactly one project.
      # Installing the other two engines would add minutes for browsers no
      # project names.
      - name: Install Chromium
        run: pnpm --filter storefront exec playwright install --with-deps chromium

      # Same reasoning as the gates above: generated per run, throwaway, never
      # stored, so this workflow keeps its promise that no job needs a secret.
      - name: Generate an ephemeral JWT_SECRET
        run: |
          echo "JWT_SECRET=$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")" >> "$GITHUB_ENV"

      - name: Start MongoDB replica set
        run: docker compose -f docker-compose.dev.yml up -d --wait

      # Asserted, not assumed — a compose filename is not evidence of a
      # topology, and `global-setup.ts` opens a transaction before the first
      # spec runs.
      - name: Prove the topology has a PRIMARY
        run: >
          docker exec nest-electronics-mongo mongosh --quiet --eval
          'const h = db.adminCommand({ hello: 1 });
           if (!h.setName || !h.isWritablePrimary) {
             print("FAIL: not a replica set PRIMARY: " + JSON.stringify(h));
             quit(1);
           }
           print("replica set " + h.setName + " PRIMARY at " + h.me + ", server " + db.version());'

      - name: Storefront browser suite
        run: pnpm --filter storefront test:e2e

      # `trace: retain-on-failure` and `screenshot: only-on-failure` write here.
      # Without the upload a red run in CI is a stack trace and nothing to look
      # at, which is how a browser failure becomes "probably flaky".
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-browser-failures
          path: |
            apps/storefront/test-results/
            apps/storefront/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop MongoDB
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  admin-browser-gate:
    name: Admin browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/nest_electronics_browser_admin

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter admin exec playwright install --with-deps chromium

      - name: Generate an ephemeral JWT_SECRET
        run: |
          echo "JWT_SECRET=$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")" >> "$GITHUB_ENV"

      - name: Start MongoDB replica set
        run: docker compose -f docker-compose.dev.yml up -d --wait

      - name: Prove the topology has a PRIMARY
        run: >
          docker exec nest-electronics-mongo mongosh --quiet --eval
          'const h = db.adminCommand({ hello: 1 });
           if (!h.setName || !h.isWritablePrimary) {
             print("FAIL: not a replica set PRIMARY: " + JSON.stringify(h));
             quit(1);
           }
           print("replica set " + h.setName + " PRIMARY at " + h.me + ", server " + db.version());'

      # `admin`'s `test:e2e` is TWO Playwright runs, and both matter: the main
      # config, and `playwright.unreachable-api.config.ts`, which starts a
      # second admin pointed at a port nothing is listening on to prove the
      # console degrades honestly when the API is unreachable. Running only the
      # first would gate the happy path and leave the failure path where the
      # whole suite was a week ago.
      - name: Admin browser suite (main + unreachable-API configs)
        run: pnpm --filter admin test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-failures
          path: |
            apps/admin/test-results/
            apps/admin/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop MongoDB
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
