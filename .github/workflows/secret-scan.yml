# Nest Electronics — secret scan (blocking)
#
# A separate workflow from ci.yml on purpose, for two reasons.
#
# 1. SCOPE. ci.yml runs `on: push: branches: [main]`, so pushing a feature
#    branch does not trigger it. That is a sensible economy for lint and tests
#    and a hole for this check: a credential is on the remote the moment it is
#    pushed, whatever branch carries it. This runs on EVERY push to EVERY
#    branch, and on every pull request.
#
# 2. COST. The scanner has no dependencies — node and git, nothing installed,
#    no database, no build. It finishes in seconds, so running it everywhere is
#    close to free, and it has no reason to wait behind a pnpm install.
#
# Why it exists at all: this scanner found a live ANTHROPIC_API_KEY on its first
# real run, committed in the initial commit and still on the remote four months
# later, in a repository a manual audit had called clean about forty commits
# earlier. See SECURITY.md.
#
# It is a REAL gate. No continue-on-error: a finding fails the build.

name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secrets in history
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 is load-bearing. The scanner reads every blob reachable
      # from every ref, because deleting a secret does nothing — the blob stays
      # in the history, and the history is what gets cloned. With the default
      # shallow clone there would be almost nothing to read and the job would
      # pass by looking at nothing, which is the worst way for it to pass.
      # The scanner detects that case and fails rather than reporting clean.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The script self-tests before it scans: every pattern must detect a fake
      # secret of its own class, or the build fails on the spot. A scanner that
      # has never found anything is indistinguishable from one that cannot.
      - name: Scan every blob on every ref
        run: node scripts/scan-secrets.mjs
